<div class="flex flex-col gap-4 p-4">
  <header class="flex gap-4 max-sm:items-center sm:grid sm:grid-cols-3">
    <button
      (click)="menuPanel.activate()"
      class="flex items-center justify-center gap-1 sm:hidden"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
        />
      </svg>
    </button>
    <nav class="max-sm:hidden">
      <ul class="flex items-center justify-end gap-4">
        <li class="hover:underline">About</li>
        <li class="hover:underline">Project</li>
      </ul>
    </nav>
    <p class="place-self-center text-xl font-semibold uppercase">Athenexfolk</p>
    <nav class="max-sm:hidden">
      <ul class="flex items-center justify-start gap-4">
        <li class="hover:underline">Blog</li>
        <li class="hover:underline">Contact</li>
      </ul>
    </nav>
  </header>
  <div class="flex flex-col gap-2">
    <div class="flex flex-col justify-center h-dvh min-h-72 gap-2">
      <h1 class="text-center text-4xl">Saksit Sirisakda</h1>
      <div class="flex items-center justify-center gap-1">
        <div class="w-4 border-t"></div>
        <p class="text-center text-lg">Full Stack Web Developer</p>
        <div class="w-4 border-t"></div>
      </div>
    </div>
    <!-- <div class="mx-auto w-full max-w-sm rounded-2xl bg-stone-100 p-4">
      <p class="block text-center">To be a good person.</p>
    </div> -->
    <div>
      <h3 class="text-2xl font-semibold">Skills</h3>
      <div class="flex flex-col gap-8">
        @for (skill of skillTechs; track $index) {
          <div class="flex flex-col gap-4">
            <div class="flex justify-center items-center gap-4">
              <div class="w-10 border-t border-stone-300"></div>
              <h4 class="text-xl font-medium">{{ skill.name }}</h4>
              <div class="w-10 border-t border-stone-300"></div>
            </div>
            <div class="flex gap-4 justify-center flex-wrap">
              @for (tech of skill.techs; track $index) {
                <app-technology
                  [name]="tech.name"
                  [image]="tech.image"
                  [mastery]="tech.mastery"
                />
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>

<div
  (click)="menuPanel.deactivate()"
  [class]="`fixed top-0 left-0 w-full h-dvh transition-all duration-500 bg-white/10 ${menuPanel.active ? 'visible opacity-100 backdrop-blur-3xl' :  'invisible opacity-0'}`"
></div>
<div
  [class]="`fixed top-0 h-dvh w-72 bg-white shadow-2xl transition-all duration-500 ${menuPanel.active ? 'left-0' : '-left-full'}`"
></div>
