<div class="flex flex-col items-center gap-2 aspect-square">
  <div class="p-2 relative">
    <img
      [src]="image()"
      [alt]="name()"
      class="size-12 object-contain object-center"
    />
    @if (mastery()) {
      <app-master-badge class="absolute -top-2 -right-2 text-[#FFD700]" />
    }
  </div>
  {{ name() }}
</div>
